# Default post-process (repository enrichment) module sequence.
# Each entry is a Python module path. Importing it triggers registry.register()
# for the BaseModule subclass it contains (pipeline_phase = POSTPROCESS_PHASE).
#
# These modules are run ONLY by the PostProcessor (a pipeline file's
# `postprocessing:` list), never by the live pipeline. To add a post-process
# module: write the module class and add its dotted import path here — no CLI or
# framework code changes required. If the module needs a store-backed input that
# no other module produces, register a provider for that key in
# adapt/runtime/store_inputs.py (one function + one register call).
#
postprocess:
  modules:
    - adapt.execution.nodes.xlma_stat
