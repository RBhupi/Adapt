# The module catalog: every per-scan module a pipeline file may list.
# Each line names a module's class as package.file:Class (a BaseModule
# subclass); loading the catalog registers it.
# A module runs after the modules it reads from; modules that do not read from
# each other run in the order of this list.

pipeline:
  modules:
    - adapt.modules.ingest.node:LoadModule
    - adapt.modules.detection.node:DetectModule
    - adapt.modules.projection.node:ProjectionModule
    - adapt.modules.analysis.node:AnalysisModule
    - adapt.modules.tracking.node:TrackingModule
    - adapt.modules.cell_volume_stats.node:CellVolumeStatsModule
    - adapt.modules.target_selection.node:TargetSelectionModule
    - adapt.modules.radar_command.node:RadarCommandModule
    - adapt.modules.xlma_stat.node:XlmaStatModule
