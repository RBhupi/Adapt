# The module catalog: every per-scan module a pipeline file may list.
# Each entry is a Python module path. Importing the module triggers
# registry.register() for the BaseModule subclass it contains.
# Listed modules run in dependency order determined by the execution graph —
# add entries here to extend the catalog without editing Python code.

pipeline:
  modules:
    - adapt.execution.nodes.ingest
    - adapt.execution.nodes.detection
    - adapt.execution.nodes.projection
    - adapt.execution.nodes.analysis
    - adapt.execution.nodes.tracking
    - adapt.execution.nodes.cell_volume_stats
    - adapt.execution.nodes.target_selection
    - adapt.execution.nodes.radar_command
    - adapt.execution.nodes.xlma_stat
