# Radar command preset: a dry run for the radar sandbox.
#
# radar_command turns each target_selection decision into a radar command, so the
# pipeline file must also list target_selection (and cell_volume_stats, unless
# extent.vertical_band is set). Every command is recorded in the run's
# radar_commands table. This preset has no api: section, so nothing is sent. To
# publish commands to the BNF radar API, uncomment the api: block and, before
# `adapt run`, export the three environment variables it names: the API base URL,
# the API key, and the path of the CA certificate file the API's TLS certificate is
# verified against. The environment is their only source; none of them goes in
# this file. A command is sent only for a fresh scan: one that started no longer ago
# than max_scan_age_seconds, by this machine's clock, when its command is ready; an
# older scan's command is recorded with outcome STALE and held back. A scan's time
# is the start of its volume and its file exists only when the volume ends (4 to 7
# minutes later), so the limit must cover one volume, the polling interval and the
# processing (about 30 s). The 480 shown below fits a polling interval of 30 to 60 s:
# set `params: downloader: poll_interval_sec` to that too, because with the default
# of 300 s many live scans are already older than 480 s when they are picked up.
# A run over a stored run (run.source: stored_run) never sends, with or without api:.

radar_command:
  planning:
    horizon_minutes: 12         # each plan reaches 12 minutes ahead,
    interval_seconds: 60        # one target entry a minute (whole minutes that divide the horizon)

  radar:
    scan_pattern: rhi3_ppi7     # the scan pattern the radar is asked to run
    user_id: adapt_sandbox      # sent with every command

  extent:
    horizontal_buffer_km: 2.0   # margin around each projected footprint's box
    # vertical_band:            # a fixed band for every target, instead of each cell's measured base/top
    #   altitude_min_m: 500.0   # metres above mean sea level
    #   altitude_max_m: 15000.0

  # api:
  #   base_url_env: BNF_API_URL         # variable holding the base URL; POSTs go to {base URL}/publish/command
  #   api_key_env: BNF_RADAR_API_KEY    # variable holding the API key
  #   ca_file_env: ARM_API_CERT         # variable holding the path of the CA certificate file (PEM)
  #   timeout_seconds: 10
  #   max_scan_age_seconds: 480         # send only while the scan started no longer ago than this
