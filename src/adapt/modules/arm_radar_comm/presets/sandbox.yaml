# ARM radar command options: a dry run for the radar sandbox. Every option must be
# given: arm_radar_comm has no defaults.
#
# arm_radar_comm turns each target_selection decision into a radar command, so the
# pipeline file must also list target_selection (and cell_volume_stats, unless
# extent.vertical_band is set). Every command is recorded in the run's
# radar_commands table. No address, key or user is written here: the file names
# the environment variables that hold them, and the environment is their only
# source. Export them before `adapt run`:
#
#   ARM_ADAPT_USER      the user id sent with every command (needed for a dry run too)
#   ARM_RADAR_URL       the radar's API base URL, e.g. https://apigw.vsn.arm.gov/bnf
#   BNF_RADAR_API_KEY   the API key, sent as the X-API-Key header
#   ARM_API_CERT        the path of the CA certificate file (PEM) the API's TLS
#                       certificate is verified against
#
# Commands are POSTed to {ARM_RADAR_URL}/publish/command.
#
# api: null is the dry run: commands are recorded, nothing is sent. To send,
# replace api: null with the api: block below it, uncommented. A command is sent
# only for a fresh scan: one that started no longer ago than max_scan_age_seconds,
# by this machine's clock, when its command is ready; an older scan's command is
# recorded with outcome STALE and held back. A scan's time is the start of its
# volume and its file exists only when the volume ends (4 to 7 minutes later), so
# the limit must cover one volume, the polling interval and the processing (about
# 30 s). The 480 shown below fits a polling interval of 30 to 60 s: set the
# polling interval of the source, `params: aws_nexrad: poll_interval_sec`, to that
# too, because with the default of 300 s many live scans are already older than
# 480 s when they are picked up.
# A run over a stored run (run.source: stored_run) never sends, with or without api.

arm_radar_comm:
  planning:
    horizon_minutes: 12         # each plan reaches 12 minutes ahead,
    interval_seconds: 60        # one target entry a minute (whole minutes that divide the horizon)

  radar:
    scan_pattern: rhi3_ppi7     # the scan pattern the radar is asked to run
    user_id_env: ARM_ADAPT_USER # variable holding the user id sent with every command

  extent:
    horizontal_buffer_km: 2.0   # margin around each projected footprint's box
    vertical_band: null         # null: each cell's measured base/top; or a fixed band for every target:
    # vertical_band:
    #   altitude_min_m: 500.0   # metres above mean sea level
    #   altitude_max_m: 15000.0

  api: null                     # null: a dry run, nothing is sent. To send, use this block instead:
  # api:
  #   base_url_env: ARM_RADAR_URL       # variable holding the radar's base URL (with the radar: .../bnf)
  #   api_key_env: BNF_RADAR_API_KEY    # variable holding the API key
  #   ca_file_env: ARM_API_CERT         # variable holding the path of the CA certificate file (PEM)
  #   timeout_seconds: 10               # timeout of each publish request
  #   max_scan_age_seconds: 480         # send only while the scan started no longer ago than this
